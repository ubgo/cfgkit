# https://taskfile.dev
#
# Tasks for the examples module. It carries the same file as every adapter, so
# `task test` and `task ci` mean the same thing here as everywhere else.
#
# The examples run in the gate on purpose: every one pins its own output in an
# example_test.go, so documentation that drifts from the code fails the build
# instead of quietly becoming a lie.

version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Report statement coverage
    cmds:
      - go test -coverprofile=cover.out ./...
      - go tool cover -func=cover.out | tail -1

  test:cover:html:
    desc: Open the coverage report in a browser
    deps: [test:cover]
    cmds:
      - go tool cover -html=cover.out

  test:uncovered:
    desc: List functions below 100% coverage
    cmds:
      - go test -coverprofile=cover.out ./... > /dev/null
      - 'go tool cover -func=cover.out | grep -v "100.0%" || echo "everything is covered"'

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:check:
    desc: Fail when the source is unformatted
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

  ci:
    desc: The full gate for this module
    cmds:
      - task: fmt:check
      - task: vet
      - task: test:race

  clean:
    desc: Remove coverage artifacts
    cmds:
      - rm -f cover.out cover.html
